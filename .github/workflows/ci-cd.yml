name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing123
          POSTGRES_DB: billing_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      DATABASE_URL: postgresql://billing:billing123@localhost:5432/billing_db?schema=public
      MONGODB_URL: mongodb://localhost:27017/billing_logs
      RABBITMQ_URL: amqp://localhost:5672
      JWT_SECRET: test-secret
      MERCADO_PAGO_ACCESS_TOKEN: test-token
      PORT: 3001
      API_PREFIX: api/v1
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fiap-mecanica-billing:latest
